name: ci
on:
  pull_request:
    branches:
      - main
      - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # needs: build
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 26.x
          cache: pnpm
      # install
      - name: Install dependencies 📦
        run: pnpm clean-install --frozen-lockfile
      # generate
      - name: Generate deps 🍪
        run: pnpm run generate
        env:
          CI: true
      # lint
      - name: Typecheck 🧷
        run: pnpm run typecheck
      - name: Lint 🛫
        run: pnpm run lint
      # build
      - name: Build 🏗
        run: pnpm run build
      # test on the matrix node version; pnpm is bypassed because devEngines requires node 26
      - uses: actions/setup-node@v4.0.3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test 🧪
        run: ./node_modules/.bin/tsx --test "tests/**/*.test.ts"
      - name: Smoke test dist 💨
        run: |
          node --input-type=module -e "import { I4n } from './dist/index.js'; if (typeof I4n !== 'function') process.exit(1)"
          node -e "if (typeof require('./dist/index.cjs').I4n !== 'function') process.exit(1)"
